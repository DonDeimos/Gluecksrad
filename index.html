<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glücksrad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    color: #1a1a2e;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #6c3de5, #e5523d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .wheels-row {
    display: flex;
    flex-wrap: wrap;
    gap: 36px;
    justify-content: center;
    width: 100%;
    max-width: 1100px;
  }

  .wheel-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 320px;
    max-width: 500px;
  }

  .wheel-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #444;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .wheel-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .pointer-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
    margin-bottom: -2px;
  }

  canvas {
    display: block;
    border-radius: 50%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }

  .result-box {
    margin-top: 16px;
    padding: 14px 24px;
    background: linear-gradient(135deg, #f9f5ff, #fff5f3);
    border: 2px solid #e0d4fc;
    border-radius: 16px;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 800;
    text-align: center;
    width: 100%;
    opacity: 0;
    transform: scale(0.85) translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    will-change: transform, opacity;
    min-height: 54px;
  }

  .result-box.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  /* Buttons row */
  .controls-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 28px 0 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #spin-btn {
    padding: 14px 52px;
    font-size: 1.2rem;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #6c3de5, #a13de5);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(108,61,229,0.35);
    transition: transform 0.12s, box-shadow 0.12s, opacity 0.2s;
    letter-spacing: 0.03em;
  }

  #spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(108,61,229,0.45);
  }

  #spin-btn:active:not(:disabled) { transform: translateY(0); }

  #spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Konfetti-Toggle */
  #confetti-btn {
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    border: 2px solid #e0d4fc;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.18s;
    background: #f9f5ff;
    color: #6c3de5;
    white-space: nowrap;
  }

  #confetti-btn.on {
    background: linear-gradient(135deg, #f9f5ff, #fce4ff);
    border-color: #c47af5;
    color: #6c3de5;
  }

  #confetti-btn.off {
    background: #f5f5f5;
    border-color: #ddd;
    color: #999;
  }

  #confetti-btn:hover {
    transform: translateY(-1px);
  }

  /* Editor section */
  .editor-section {
    margin-top: 22px;
    width: 100%;
  }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .editor-header h2 {
    font-size: 0.88rem;
    font-weight: 700;
    color: #777;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Feldanzahl-Stepper */
  .count-stepper {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .count-stepper span {
    font-size: 0.82rem;
    color: #888;
    font-weight: 600;
  }

  .count-display {
    font-size: 0.92rem;
    font-weight: 700;
    color: #1a1a2e;
    min-width: 24px;
    text-align: center;
  }

  .count-btn {
    width: 26px;
    height: 26px;
    border: 1.5px solid #d0c4f7;
    border-radius: 8px;
    background: #f4f0ff;
    color: #6c3de5;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, transform 0.1s;
    line-height: 1;
    padding: 0;
    font-family: inherit;
  }

  .count-btn:hover:not(:disabled) {
    background: #e8deff;
    transform: scale(1.1);
  }

  .count-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .segments-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 8px;
  }

  .seg-row {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #fafafa;
    border: 1.5px solid #e8e8e8;
    border-radius: 10px;
    padding: 7px 10px;
    transition: border-color 0.15s;
  }

  .seg-row:focus-within { border-color: #a07af5; }

  .seg-swatch {
    width: 13px;
    height: 13px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .seg-row input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.82rem;
    color: #1a1a2e;
    outline: none;
    min-width: 0;
  }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    top: -10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 680px) {
    body { padding: 16px 10px 36px; }
    .wheels-row { gap: 24px; }
  }
</style>
</head>
<body>

<h1>🎡 Glücksrad</h1>

<div class="wheels-row">
  <div class="wheel-section">
    <div class="wheel-title">Rad 1</div>
    <div class="wheel-container">
      <div class="pointer-wrap" id="pointer-wrap-1"></div>
      <canvas id="wheel-1"></canvas>
    </div>
    <div class="result-box" id="result-box-1"></div>
    <section class="editor-section">
      <div class="editor-header">
        <h2>Felder bearbeiten</h2>
        <div class="count-stepper">
          <span>Felder:</span>
          <button class="count-btn" id="dec-1">−</button>
          <div class="count-display" id="count-display-1">15</div>
          <button class="count-btn" id="inc-1">+</button>
        </div>
      </div>
      <div class="segments-list" id="segments-list-1"></div>
    </section>
  </div>

  <div class="wheel-section">
    <div class="wheel-title">Rad 2</div>
    <div class="wheel-container">
      <div class="pointer-wrap" id="pointer-wrap-2"></div>
      <canvas id="wheel-2"></canvas>
    </div>
    <div class="result-box" id="result-box-2"></div>
    <section class="editor-section">
      <div class="editor-header">
        <h2>Felder bearbeiten</h2>
        <div class="count-stepper">
          <span>Felder:</span>
          <button class="count-btn" id="dec-2">−</button>
          <div class="count-display" id="count-display-2">15</div>
          <button class="count-btn" id="inc-2">+</button>
        </div>
      </div>
      <div class="segments-list" id="segments-list-2"></div>
    </section>
  </div>
</div>

<div class="controls-row">
  <button id="spin-btn">Drehen</button>
  <button id="confetti-btn" class="on">🎊 Konfetti: AN</button>
</div>

<script>
(() => {
  const MIN_SEG = 2;
  const MAX_SEG = 20;

  const PALETTE = [
    '#e63946','#f4a261','#2a9d8f','#457b9d','#e9c46a',
    '#6a4c93','#06d6a0','#ef476f','#118ab2','#ffd166',
    '#7b2d8b','#52b788','#f77f00','#4361ee','#b5179e'
  ];

  const CONFETTI_COLORS = [
    '#e63946','#f4a261','#2a9d8f','#e9c46a','#6a4c93',
    '#06d6a0','#ef476f','#118ab2','#ffd166','#b5179e'
  ];

  // ─── Konfetti-Toggle ──────────────────────────────────────────────────────
  let confettiOn = true;
  const confettiBtn = document.getElementById('confetti-btn');
  confettiBtn.addEventListener('click', () => {
    confettiOn = !confettiOn;
    confettiBtn.textContent = confettiOn ? '🎊 Konfetti: AN' : '🎊 Konfetti: AUS';
    confettiBtn.className   = confettiOn ? 'on' : 'off';
  });

  // ─── Easing functions ─────────────────────────────────────────────────────
  // Rad 1: sanftes kubisches Abbremsen
  function easingCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  // Rad 2: exponentielles Decay — dreht schnell, bremst dann scharf
  function easingExpoDecay(t) {
    return 1 - Math.pow(2, -10 * t);
  }

  // ─── Wheel factory ────────────────────────────────────────────────────────
  function createWheel(canvasId, pointerWrapId, segListId, resultBoxId,
                       countDisplayId, decBtnId, incBtnId,
                       easingFn, spinRanges, initialCount) {

    const canvas      = document.getElementById(canvasId);
    const ctx         = canvas.getContext('2d');
    const ptrWrap     = document.getElementById(pointerWrapId);
    const segListEl   = document.getElementById(segListId);
    const resultBox   = document.getElementById(resultBoxId);
    const countDisp   = document.getElementById(countDisplayId);
    const decBtn      = document.getElementById(decBtnId);
    const incBtn      = document.getElementById(incBtnId);

    let numSegments    = initialCount;
    // savedLabels stores all entered text, growing as needed
    let savedLabels    = Array.from({length: MAX_SEG}, (_, i) => `Feld ${i + 1}`);
    let size           = 400;
    let currentAngle   = 0;
    let highlightIndex = -1;
    let spinning       = false;

    function activeLabels() {
      return savedLabels.slice(0, numSegments);
    }

    function computeSize() {
      const vw = window.innerWidth;
      const available = vw < 720
        ? Math.min(vw - 28, 500)
        : Math.min((vw - 100) / 2, 460);
      size = Math.max(240, available);
      canvas.width  = size;
      canvas.height = size;
    }

    function buildPointer() {
      const ph = Math.round(size * 0.08);
      const pw = Math.round(size * 0.07);
      ptrWrap.innerHTML =
        `<svg width="${pw}" height="${ph}" viewBox="0 0 ${pw} ${ph}" xmlns="http://www.w3.org/2000/svg">
          <polygon points="${pw/2},${ph} 0,0 ${pw},0"
            fill="#ff2d55" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
        </svg>`;
    }

    function drawWheel() {
      const lbls = activeLabels();
      const n    = numSegments;
      const cx = size / 2, cy = size / 2, r = size / 2 - 4;
      const sliceAngle = (2 * Math.PI) / n;
      const fontSize   = Math.max(8, Math.round(size * 0.034));

      ctx.clearRect(0, 0, size, size);

      for (let i = 0; i < n; i++) {
        const startA = currentAngle + i * sliceAngle;
        const endA   = startA + sliceAngle;
        const midA   = startA + sliceAngle / 2;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startA, endA);
        ctx.closePath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();

        if (i === highlightIndex) {
          ctx.strokeStyle = 'rgba(255,255,255,0.95)';
          ctx.lineWidth   = Math.max(3, size * 0.012);
          ctx.stroke();
          ctx.save();
          ctx.shadowColor = '#fff';
          ctx.shadowBlur  = 18;
          ctx.stroke();
          ctx.restore();
        }

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startA, endA);
        ctx.closePath();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth   = 1;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(midA);
        ctx.textAlign    = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = '#fff';
        ctx.font         = `bold ${fontSize}px system-ui, sans-serif`;
        ctx.shadowColor  = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur   = 4;
        const maxR = r - 14;
        let txt = lbls[i];
        while (ctx.measureText(txt).width > maxR * 0.72 && txt.length > 1) {
          txt = txt.slice(0, -1);
        }
        if (txt !== lbls[i]) txt = txt.slice(0, -1) + '…';
        ctx.fillText(txt, r - 12, 0);
        ctx.restore();
      }

      // Mittelnabe
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.045, 0, 2 * Math.PI);
      ctx.fillStyle   = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur  = 8;
      ctx.fill();
      ctx.shadowBlur  = 0;
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth   = 2;
      ctx.stroke();
    }

    function getWinnerIndex() {
      const sliceAngle   = (2 * Math.PI) / numSegments;
      const norm         = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const pointerAngle = 3 * Math.PI / 2;
      const offset       = ((pointerAngle - norm) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      return Math.floor(offset / sliceAngle) % numSegments;
    }

    function buildEditor() {
      segListEl.innerHTML = '';
      for (let i = 0; i < numSegments; i++) {
        const row = document.createElement('div');
        row.className = 'seg-row';

        const swatch = document.createElement('div');
        swatch.className = 'seg-swatch';
        swatch.style.background = PALETTE[i % PALETTE.length];

        const inp = document.createElement('input');
        inp.type      = 'text';
        inp.value     = savedLabels[i];
        inp.maxLength = 28;
        inp.setAttribute('aria-label', `Segment ${i + 1}`);
        const idx = i;
        inp.addEventListener('input', () => {
          savedLabels[idx] = inp.value || `Feld ${idx + 1}`;
          drawWheel();
        });

        row.appendChild(swatch);
        row.appendChild(inp);
        segListEl.appendChild(row);
      }

      countDisp.textContent = numSegments;
      decBtn.disabled = numSegments <= MIN_SEG;
      incBtn.disabled = numSegments >= MAX_SEG;
    }

    function setCount(n) {
      numSegments    = Math.max(MIN_SEG, Math.min(MAX_SEG, n));
      highlightIndex = -1;
      resultBox.classList.remove('visible');
      buildEditor();
      drawWheel();
    }

    decBtn.addEventListener('click', () => setCount(numSegments - 1));
    incBtn.addEventListener('click', () => setCount(numSegments + 1));

    function spin(onDone) {
      if (spinning) return;
      spinning = true;
      highlightIndex = -1;
      resultBox.classList.remove('visible');

      const duration   = (spinRanges.minDur + Math.random() * spinRanges.durRange) * 1000;
      const extraSpins = spinRanges.minSpins + Math.floor(Math.random() * spinRanges.spinRange);
      const totalDelta = extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;

      const startAngle = currentAngle;
      const startTime  = performance.now();

      function frame(now) {
        const elapsed = now - startTime;
        const t       = Math.min(elapsed / duration, 1);
        currentAngle  = startAngle + totalDelta * easingFn(t);
        drawWheel();

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          currentAngle   = startAngle + totalDelta;
          spinning       = false;
          highlightIndex = getWinnerIndex();
          drawWheel();
          resultBox.textContent = `🎉 ${activeLabels()[highlightIndex]}`;
          resultBox.classList.add('visible');
          if (onDone) onDone();
        }
      }

      requestAnimationFrame(frame);
    }

    function resize() {
      computeSize();
      buildPointer();
      drawWheel();
    }

    // Init
    computeSize();
    buildPointer();
    drawWheel();
    buildEditor();

    return {
      spin,
      resize,
      isSpinning: () => spinning
    };
  }

  // ─── Räder erzeugen ───────────────────────────────────────────────────────
  const wheel1 = createWheel(
    'wheel-1', 'pointer-wrap-1', 'segments-list-1', 'result-box-1',
    'count-display-1', 'dec-1', 'inc-1',
    easingCubic,
    { minDur: 4, durRange: 3, minSpins: 5, spinRange: 5 },
    15
  );

  const wheel2 = createWheel(
    'wheel-2', 'pointer-wrap-2', 'segments-list-2', 'result-box-2',
    'count-display-2', 'dec-2', 'inc-2',
    easingExpoDecay,
    { minDur: 3.5, durRange: 4, minSpins: 4, spinRange: 8 },
    15
  );

  // ─── Spin-Button ──────────────────────────────────────────────────────────
  const spinBtn = document.getElementById('spin-btn');

  spinBtn.addEventListener('click', () => {
    if (wheel1.isSpinning() || wheel2.isSpinning()) return;
    spinBtn.disabled = true;

    let done = 0;
    function onDone() {
      done++;
      if (done === 2) {
        spinBtn.disabled = false;
        if (confettiOn) launchConfetti();
      }
    }

    wheel1.spin(onDone);
    wheel2.spin(onDone);
  });

  // ─── Confetti ─────────────────────────────────────────────────────────────
  function launchConfetti() {
    for (let i = 0; i < 140; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const s = 6 + Math.random() * 8;
      el.style.cssText = `
        width:${s}px; height:${s}px;
        left:${Math.random() * 100}vw;
        background:${CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]};
        border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
        animation-duration:${1.8 + Math.random() * 1.6}s;
        animation-delay:${Math.random() * 0.8}s;
      `;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  // ─── Responsive Resize ────────────────────────────────────────────────────
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      wheel1.resize();
      wheel2.resize();
    }, 80);
  });

})();
</script>
</body>
</html>
